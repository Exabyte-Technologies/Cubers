name: cubers-dev
services:
  postgres:
    image: postgres:17-alpine
    environment: {POSTGRES_USER: cubers, POSTGRES_PASSWORD: cubers_dev_only, POSTGRES_DB: cubers}
    ports: ["127.0.0.1:54329:5432"]
    volumes: ["db:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U cubers"], interval: 5s, timeout: 3s, retries: 20}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6389:6379"]
    volumes: ["redis:/data"]
  storage:
    build: {context: .., dockerfile: infra/Dockerfile.api, target: development-storage}
    environment:
      S3_ACCESS_KEY: S3RVER
      S3_SECRET_KEY: S3RVER
      S3_BUCKETS: cubers-intl,cubers-cn
      STORAGE_CORS_ORIGINS: http://localhost:8081,http://127.0.0.1:8081,http://localhost:4173,http://127.0.0.1:4173
    ports: ["127.0.0.1:9009:9000"]
    volumes: ["media-emulator:/data"]
    read_only: true
    tmpfs: ["/tmp:size=67108864,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  mail:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:10259:1025", "127.0.0.1:8029:8025"]
volumes: {db: {}, redis: {}, media-emulator: {}}
